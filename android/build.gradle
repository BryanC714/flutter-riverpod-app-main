buildscript {
    ext.kotlin_version = '1.9.10' // Actualiza a la última versión compatible
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'  // Usa la última versión compatible
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'dev.flutter:flutter-gradle-plugin' // Asegúrate de que esta versión sea la última
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}
